<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 16px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    .add-task {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-task input {
      flex: 1;
    }

    .task {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border: 1px solid #e5e7eb;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .task-content {
      flex: 1;
      min-width: 200px;
    }

    .task-content p {
      margin: 0;
    }

    .time {
      font-size: 12px;
      color: blueviolet;
      padding-top:8px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .yes {
      background: #e5e7eb;
    }

    .yes.active {
      background: #22c55e;
      color: white;
    }

    .no {
      background: #e5e7eb;
    }

    .no.active {
      background: #ef4444;
      color: white;
    }

    .remove {
      background: #ef4444;
      color: white;
    }

    @media (max-width: 500px) {
      .task {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2 id="today"></h2>

  <div class="add-task">
    <input id="taskInput" type="text" placeholder="Enter your task..." />
    <button onclick="addTask()">Add</button>
  </div>

  <div id="taskList"></div>
</div>

<script>
  const taskInput = document.getElementById("taskInput");
  const taskList = document.getElementById("taskList");

  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  // Show today's date like: 2026 January 19 Monday
  function showToday() {
    const d = new Date();
    const options = { year: "numeric", month: "long", day: "numeric", weekday: "long" };
    document.getElementById("today").textContent = d.toLocaleDateString("en-US", options);
  }

  showToday();

  function save() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function timeAgo(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);

    if (seconds < 60) return "just now";

    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes} minute${minutes > 1 ? "s" : ""} ago`;

    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} hour${hours > 1 ? "s" : ""} ago`;

    const days = Math.floor(hours / 24);
    return `${days} day${days > 1 ? "s" : ""} ago`;
  }

  function addTask() {
    if (!taskInput.value.trim()) return;

    tasks.unshift({
      text: taskInput.value,
      done: null,
      createdAt: Date.now()
    });

    taskInput.value = "";
    save();
    render();
  }

  function toggleYes(index) {
    tasks[index].done = true;
    save();
    render();
  }

  function toggleNo(index) {
    tasks[index].done = false;
    save();
    render();
  }

  function removeTask(index) {
    tasks.splice(index, 1);
    save();
    render();
  }

  function render() {
    taskList.innerHTML = "";

    tasks.forEach((task, index) => {
      const div = document.createElement("div");
      div.className = "task";

      div.innerHTML = `
        <div class="task-content">
          <p>${task.text}</p>
          <p class="time">${timeAgo(task.createdAt)}</p>
        </div>

        <div class="actions">
          <button class="yes ${task.done === true ? "active" : ""}"
            onclick="toggleYes(${index})">Yes</button>

          <button class="no ${task.done === false ? "active" : ""}"
            onclick="toggleNo(${index})">No</button>

          <button class="remove"
            onclick="removeTask(${index})">Remove</button>
        </div>
      `;

      taskList.appendChild(div);
    });
  }

  render();

  // Auto update "time ago" every minute
  setInterval(render, 60000);
</script>

</body>
</html>
